# Dependabot abre sus pull requests contra develop, una vez al mes.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      windows:
        patterns:
          - "windows*"
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    groups:
      acciones:
        patterns:
          - "*"
